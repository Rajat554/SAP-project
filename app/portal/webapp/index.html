<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>WashWizard Manager</title>
    <link rel="icon" href="https://sapui5.hana.ondemand.com/1.120.0/resources/sap/tnt/themes/base/img/Icon.ico">
    <style>
        html, body, #content {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
    <!-- SAPUI5 Bootstrap -->
    <script
        id="sap-ui-bootstrap"
        src="https://sapui5.hana.ondemand.com/1.120.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.tnt,sap.ui.core"
        data-sap-ui-async="true"
        data-sap-ui-compat-version="edge"
        data-sap-ui-frame-options="trusted"
    ></script>
    <script>
            sap.ui.getCore().attachInit(function () {
                sap.ui.require([
                    "sap/ui/core/ComponentContainer"
                ], function (ComponentContainer) {
                    "use strict";

                    sap.ui.loader.config({
                        paths: {
                            "washwizard/portal": "./"
                        }
                    });

                    new ComponentContainer({
                        name: "washwizard.portal",
                        height: "100%",
                        settings: { id: "washwizard.portal" }
                    }).placeAt("content");
                });
            });
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
</body>
</html>
