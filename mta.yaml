_schema-version: "3.2"
ID: sap-project
version: 2.0.0
description: A Fiori application for WashWizard with optimized memory.

parameters:
  enable-parallel-executions: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # ── 1. Backend CAP OData Service ──────────────────────────────
  - name: sap-project-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: sap-project-hdi-container
      - name: sap-project-xsuaa
      - name: sap-project-db-deployer
    provides:
      - name: srv_api
        properties:
          srv-url: ${default-url}

  # ── 2. Database Deployer (HANA Cloud) ─────────────────────────
  - name: sap-project-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: sap-project-hdi-container

  # ── 3. Standalone Approuter (Enforces Security & Routing) ─────
  - name: sap-project-router
    type: approuter.nodejs
    path: router
    parameters:
      memory: 256M
      disk-quota: 256M
    requires:
      - name: sap-project-xsuaa
      - name: sap-project-dest-service
      - name: srv_api
        group: destinations
        properties:
          name: srv_target
          url: ~{srv-url}
          forwardAuthToken: true



resources:
  # HANA HDI Container (production database)
  - name: sap-project-hdi-container
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: ${service-name}

  # XSUAA (authentication & authorization)
  - name: sap-project-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: sap-project
        tenant-mode: dedicated



  # Destination Service
  - name: sap-project-dest-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite