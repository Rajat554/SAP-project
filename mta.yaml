_schema-version: "3.2"
ID: sap-project
version: 2.0.0
description: A Fiori application for WashWizard with optimized memory.

parameters:
  enable-parallel-executions: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # ── 1. Backend CAP OData Service ──────────────────────────────
  - name: sap-project-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: sap-project-hdi-container
      - name: sap-project-xsuaa
      - name: sap-project-db-deployer
    provides:
      - name: srv_api
        properties:
          srv-url: ${default-url}

  # ── 2. Database Deployer (HANA Cloud) ─────────────────────────
  - name: sap-project-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: sap-project-hdi-container

  # ── 3. Standalone Approuter (Enforces Security & Routing) ─────
  - name: sap-project-router
    type: approuter.nodejs
    path: router
    parameters:
      memory: 256M
      disk-quota: 256M
    requires:
      - name: sap-project-xsuaa
      - name: sap-project-dest-service
      - name: sap-project-repo-runtime
      - name: srv_api
        group: destinations
        properties:
          name: srv_target
          url: ~{srv-url}
          forwardAuthToken: true

  # ── 4. HTML5 App Content Deployer (0 MB CF Runtime Memory) ────
  - name: sap-project-ui-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: sap-project-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: service-entries
          artifacts:
            - service-entries.zip
          target-path: resources/
        - name: service-records
          artifacts:
            - service-records.zip
          target-path: resources/
        - name: analytics
          artifacts:
            - analytics.zip
          target-path: resources/
        - name: admin
          artifacts:
            - admin.zip
          target-path: resources/
        - name: catalog
          artifacts:
            - catalog.zip
          target-path: resources/
        - name: index-launchpad
          artifacts:
            - index.html
          target-path: resources/

  # ── 5. HTML5 Modules (Static App Builds) ──────────────────────
  - name: service-entries
    type: html5
    path: app/service-entries
    build-parameters:
      supported-platforms: []
      build-result: webapp
      builder: custom
      commands: []

  - name: service-records
    type: html5
    path: app/service-records
    build-parameters:
      supported-platforms: []
      build-result: webapp
      builder: custom
      commands: []

  - name: analytics
    type: html5
    path: app/analytics
    build-parameters:
      supported-platforms: []
      build-result: webapp
      builder: custom
      commands: []

  - name: admin
    type: html5
    path: app/admin
    build-parameters:
      supported-platforms: []
      build-result: webapp
      builder: custom
      commands: []

  - name: catalog
    type: html5
    path: app/catalog
    build-parameters:
      supported-platforms: []
      build-result: webapp
      builder: custom
      commands: []

  - name: index-launchpad
    type: html5
    path: app
    build-parameters:
      supported-platforms: []
      build-result: launchpad
      builder: custom
      commands:
        - npx shx mkdir -p launchpad
        - npx shx cp index.html launchpad/

resources:
  # HANA HDI Container (production database)
  - name: sap-project-hdi-container
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: ${service-name}

  # XSUAA (authentication & authorization)
  - name: sap-project-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: sap-project
        tenant-mode: dedicated

  # HTML5 App Host (stores static resources)
  - name: sap-project-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # HTML5 App Runtime (allows Approuter to fetch resources)
  - name: sap-project-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  # Destination Service
  - name: sap-project-dest-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite