_schema-version: "3.2"
ID: sap-project
version: 3.0.0
description: WashWizard — SAP BTP Gold Standard (Managed Approuter + Work Zone)

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # ── 1. Backend CAP OData Service ──────────────────────────────
  - name: sap-project-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: sap-project-hdi-container
      - name: sap-project-xsuaa
    provides:
      - name: srv_api
        properties:
          srv-url: ${default-url}

  # ── 2. Database Deployer ──────────────────────────────────────
  - name: sap-project-db-deployer
    type: custom
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
      no-route: true
      command: npm start
      health-check-type: process
    build-parameters:
      builder: custom
      commands:
        - npm install --production
      build-result: .
    requires:
      - name: sap-project-hdi-container

  # ── 3. HTML5 App Content Deployer ─────────────────────────────
  #    Uploads the 5 micro-app zip files to the HTML5 App Repository
  - name: sap-project-ui-deployer
    type: com.sap.application.content
    path: ui-deployer
    requires:
      - name: sap-project-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: washwizard-app-admin
          artifacts:
            - washwizard-app-admin.zip
          target-path: resources/
        - name: washwizard-app-analytics
          artifacts:
            - washwizard-app-analytics.zip
          target-path: resources/
        - name: washwizard-app-catalog
          artifacts:
            - washwizard-app-catalog.zip
          target-path: resources/
        - name: washwizard-app-service-entries
          artifacts:
            - washwizard-app-service-entries.zip
          target-path: resources/
        - name: washwizard-app-service-records
          artifacts:
            - washwizard-app-service-records.zip
          target-path: resources/
        - name: washwizard-app-shell
          artifacts:
            - washwizard-app-shell.zip
          target-path: resources/

  # ── 4. Subaccount Destination Content Deployer ────────────────
  #    Registers destinations at Subaccount level for Work Zone
  - name: sap-project-dest-content
    type: com.sap.application.content
    requires:
      - name: sap-project-dest-service
        parameters:
          content-target: true
      - name: sap-project-repo-host
        parameters:
          service-key:
            name: sap-project-repo-host-key
      - name: sap-project-xsuaa
        parameters:
          service-key:
            name: sap-project-xsuaa-key
      - name: srv_api
    parameters:
      content:
        subaccount:
          existing_destinations_policy: ignore
          destinations:
            - Name: washwizard_backend_api
              Description: WashWizard CAP Backend OData Service
              URL: ~{srv_api/srv-url}
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: sap-project-xsuaa
              ServiceKeyName: sap-project-xsuaa-key
              HTML5.DynamicDestination: true
              HTML5.Timeout: 60000
              sap.cloud.service: washwizard
    build-parameters:
      no-source: true

  # ── 5. Individual HTML5 Micro-App Modules ─────────────────────
  - name: washwizard-app-admin
    type: html5
    path: app/admin
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm init -y
        - npx @ui5/cli build --dest dist
        - npx shx cp webapp/xs-app.json dist/xs-app.json

  - name: washwizard-app-analytics
    type: html5
    path: app/analytics
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm init -y
        - npx @ui5/cli build --dest dist
        - npx shx cp webapp/xs-app.json dist/xs-app.json

  - name: washwizard-app-catalog
    type: html5
    path: app/catalog
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm init -y
        - npx @ui5/cli build --dest dist
        - npx shx cp webapp/xs-app.json dist/xs-app.json

  - name: washwizard-app-service-entries
    type: html5
    path: app/service-entries
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm init -y
        - npx @ui5/cli build --dest dist
        - npx shx cp webapp/xs-app.json dist/xs-app.json

  - name: washwizard-app-service-records
    type: html5
    path: app/service-records
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm init -y
        - npx @ui5/cli build --dest dist
        - npx shx cp webapp/xs-app.json dist/xs-app.json

  - name: washwizard-app-shell
    type: html5
    path: app/shell
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm init -y
        - npx @ui5/cli build --dest dist
        - npx shx cp webapp/xs-app.json dist/xs-app.json

resources:
  # HANA HDI Container
  - name: sap-project-hdi-container
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: ${service-name}

  # XSUAA (authentication & authorization)
  - name: sap-project-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: sap-project
        tenant-mode: dedicated

  # HTML5 App Host (stores the micro-app zip files)
  - name: sap-project-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # Destination Service (manages routing table)
  - name: sap-project-dest-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
