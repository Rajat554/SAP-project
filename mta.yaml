_schema-version: "3.2"
ID: sap-project
version: 2.0.0
description: A Fiori application for WashWizard with optimized memory.

parameters:
  enable-parallel-executions: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # ── 1. Backend CAP OData Service ──────────────────────────────
  - name: sap-project-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: sap-project-hdi-container
      - name: sap-project-xsuaa
      - name: sap-project-db-deployer
    provides:
      - name: srv_api
        properties:
          srv-url: ${default-url}

  # ── 2. Database Deployer (HANA Cloud) ─────────────────────────
  - name: sap-project-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: sap-project-hdi-container

  # ── 3. Standalone Approuter (Enforces Security & Routing) ─────
  - name: sap-project-router
    type: approuter.nodejs
    path: router
    parameters:
      memory: 256M
      disk-quota: 256M
    requires:
      - name: sap-project-xsuaa
      - name: sap-project-dest-service
      - name: sap-project-repo-runtime
      - name: srv_api
        group: destinations
        properties:
          name: srv_target
          url: ~{srv-url}
          forwardAuthToken: true

  # ── 4. HTML5 App Content Deployer (0 MB CF Runtime Memory) ────
  - name: sap-project-ui-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: sap-project-repo-host
        parameters:
          content-target: true
      - name: sap-project-dest-service
        parameters:
          content-target: true
      - name: sap-project-xsuaa
        parameters:
          service-key:
            name: sap-project-xsuaa-key
    build-parameters:
      build-result: resources
      requires:
        - name: washwizard-portal
          artifacts:
            - portal.zip
          target-path: resources/

  # ── 5. Single Unified HTML5 Module ────────────────────────────
  - name: washwizard-portal
    type: html5
    path: app/portal
    build-parameters:
      supported-platforms: []
      build-result: .
      builder: custom
      commands:
        - node ../../zip.js portal

resources:
  # HANA HDI Container (production database)
  - name: sap-project-hdi-container
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: ${service-name}

  # XSUAA (authentication & authorization)
  - name: sap-project-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: sap-project
        tenant-mode: dedicated

  # HTML5 App Host (stores static resources)
  - name: sap-project-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # HTML5 App Runtime (allows Approuter to fetch resources)
  - name: sap-project-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  # Destination Service
  - name: sap-project-dest-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: srv_target
                Description: WashWizard Backend Service
                Authentication: OAuth2UserTokenExchange
                ServiceInstanceName: sap-project-xsuaa
                ServiceKeyName: sap-project-xsuaa-key
                URL: ~{srv_api/srv-url}
                Type: HTTP
                ProxyType: Internet
                HTML5.DynamicDestination: true
                HTML5.Timeout: 60000
    requires:
      - name: srv_api
      - name: sap-project-xsuaa
        parameters:
          service-key:
            name: sap-project-xsuaa-key